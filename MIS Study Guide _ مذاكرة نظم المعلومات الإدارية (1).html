// cards: "title|عنوان", "body|نص"
const T=[
{t:"L1 · What is MIS?|المحاضرة 1 · ما هو MIS؟",c:[
["What is MIS?|ما هو نظام المعلومات الإدارية؟","MIS helps organizations manage operations by giving timely, accurate information for decision-making. It grew out of Data Processing (EDP) and now supports planning, scheduling and decisions. Elements: people, technology, processes, data.|نظام MIS يساعد المنظمات على إدارة عملياتها بمعلومات دقيقة وفي الوقت المناسب لدعم القرار. بدأ من معالجة البيانات (EDP) وتطور لدعم التخطيط والجدولة واتخاذ القرار. عناصره: الأفراد، التكنولوجيا، العمليات، البيانات."],
["DIKW Hierarchy|هرم DIKW","Data (raw facts) → Information (processed, meaningful) → Knowledge (insight + experience) → Wisdom (applying knowledge ethically and effectively).|البيانات (حقائق خام) ← المعلومات (بيانات معالجة لها معنى) ← المعرفة (فهم وخبرة) ← الحكمة (تطبيق المعرفة بشكل أخلاقي وفعّال)."],
["System components|مكونات النظام","Input (gather raw data) → Processing (calculate, sort, aggregate) → Output (useful results). Feedback = data about performance (e.g. sales reports); Control = corrective action based on it.|المدخلات (جمع البيانات) ← المعالجة (حساب، ترتيب، تجميع) ← المخرجات (نتائج مفيدة). التغذية الراجعة = بيانات عن أداء النظام (مثل تقارير المبيعات)، والتحكم = إجراء تصحيحي بناءً عليها."],
["Benefits & challenges|المزايا والتحديات","Benefits: better decisions, efficiency, coordination, competitive advantage, scalability. Challenges: cost, security/privacy, resistance to change, data quality, tech dependency, integration complexity.|المزايا: قرارات أفضل، كفاءة، تنسيق، ميزة تنافسية، قابلية التوسع. التحديات: التكلفة، الأمن والخصوصية، مقاومة التغيير، جودة البيانات، الاعتماد على التقنية، تعقيد التكامل."]],
q:[
{k:"mc",d:1,q:"Which is the correct DIKW order?|ما الترتيب الصحيح لـ DIKW؟",o:["Data → Information → Knowledge → Wisdom|بيانات ← معلومات ← معرفة ← حكمة","Information → Data → Wisdom → Knowledge|معلومات ← بيانات ← حكمة ← معرفة","Data → Knowledge → Information → Wisdom|بيانات ← معرفة ← معلومات ← حكمة"],a:0,e:"Each level builds on the one below: raw data is processed into information, which gains context as knowledge.|كل مستوى يبني على اللي قبله: البيانات الخام تُعالج لمعلومات، ثم تتحول لمعرفة بالسياق والخبرة."},
{k:"tf",d:1,q:"Data is raw facts without context.|البيانات هي حقائق خام بدون سياق.",a:0,e:"True. Giving data context and organization turns it into information.|صح. لما نضيف سياق وتنظيم للبيانات تصبح معلومات."},
{k:"mc",d:2,q:"Control in a system means:|التحكم (Control) في النظام يعني:",o:["Gathering raw data|جمع البيانات الخام","Corrective action based on feedback|اتخاذ إجراء تصحيحي بناءً على التغذية الراجعة","Storing output|تخزين المخرجات"],a:1,e:"Feedback measures performance; control acts on it to meet objectives.|التغذية الراجعة تقيس الأداء، والتحكم يتصرف بناءً عليها لتحقيق الأهداف."}]},
{t:"L2 · Roles & Principles|المحاضرة 2 · الأدوار والمبادئ",c:[
["Roles of MIS|أدوار MIS","Provide information for planning, coordination, directing and decision-making; support daily operations and strategic goals; facilitate communication inside and outside the organization; collect, process and distribute data.|توفير المعلومات للتخطيط والتنسيق والتوجيه واتخاذ القرار؛ دعم العمليات اليومية والأهداف الاستراتيجية؛ تسهيل التواصل داخل وخارج المنظمة؛ جمع البيانات ومعالجتها وتوزيعها."],
["Principles of MIS (1)|مبادئ MIS (1)","MBO: design MIS to achieve objectives. System approach: a system of subsystems. Exception: only exceptional information reaches top management. Integration, Subsystem concept (finance, HR, marketing), Central database for consistency.|الإدارة بالأهداف: يُصمم لتحقيق الأهداف. مدخل النظم: نظام من أنظمة فرعية. الاستثناء: المعلومة الاستثنائية فقط تصل للإدارة العليا. التكامل، مفهوم النظام الفرعي، قاعدة بيانات مركزية للاتساق."],
["Principles of MIS (2)|مبادئ MIS (2)","Proper flow of information, flexibility and adaptability, relevance, simplicity (user-friendly), control and feedback.|التدفق السليم للمعلومات، المرونة والتكيف، الملاءمة، البساطة (سهل الاستخدام)، التحكم والتغذية الراجعة."],
["Impact & limitations|الأثر والقيود","Impact: better cross-department communication, less duplication, instant storage/retrieval, better forecasting. Limits: information overload, inaccurate data, static reports, timeliness issues.|الأثر: تواصل أفضل بين الإدارات، تقليل التكرار، تخزين واسترجاع فوري، تنبؤ أفضل. القيود: زيادة المعلومات، بيانات غير دقيقة، تقارير ثابتة، مشاكل التوقيت."]],
q:[
{k:"mc",d:2,q:"Which principle says only exceptional information should reach top management?|أي مبدأ ينص على أن المعلومات الاستثنائية فقط تصل للإدارة العليا؟",o:["Principle of Exception|مبدأ الاستثناء","Principle of Simplicity|مبدأ البساطة","Principle of Integration|مبدأ التكامل"],a:0,e:"It prevents overload: managers see deviations that need action, not every routine detail.|بيمنع زيادة المعلومات: المدير يشوف الانحرافات اللي تحتاج قرار فقط، مش كل التفاصيل الروتينية."},
{k:"tf",d:1,q:"Storing data centrally is part of the Central Database principle.|تخزين البيانات مركزيًا جزء من مبدأ قاعدة البيانات المركزية.",a:0,e:"True. Central storage gives consistency and accessibility.|صح. التخزين المركزي يحقق الاتساق وسهولة الوصول."},
{k:"mc",d:2,q:"Which is a limitation of MIS?|أي مما يلي من قيود MIS؟",o:["Reduced duplication|تقليل التكرار","Information overload|زيادة المعلومات (Overload)","Faster retrieval|استرجاع أسرع"],a:1,e:"Too much data can hide what matters. The others are impacts/benefits.|كثرة البيانات تخفي المهم. الباقي من المزايا."}]},
{t:"L2 · Management & Structures|المحاضرة 2 · الإدارة والهياكل",c:[
["Managerial functions|الوظائف الإدارية","Planning, Organizing, Staffing, Directing, Controlling, Coordinating. MIS provides the information that supports each one.|التخطيط، التنظيم، التوظيف، التوجيه، الرقابة، التنسيق. و MIS يوفر المعلومات اللي تدعم كل وظيفة."],
["Organizational structures|الهياكل التنظيمية","Features: hierarchy of authority, specialization, standardization (formalization), centralization. Types: Hierarchical (pyramid, clear reporting lines) vs Flat (few middle managers, teamwork, faster decisions).|الخصائص: تسلسل السلطة، التخصص، التقييس، المركزية. الأنواع: هرمي (شكل هرم وخطوط تقارير واضحة) مقابل مسطّح (مديرون وسطاء قليلون، عمل جماعي، قرارات أسرع)."],
["Information requirements|احتياجات المعلومات","Depend on organization size, structure type, culture, internal/external stakeholders and decision-making style.|تعتمد على حجم المنظمة، نوع الهيكل، الثقافة، أصحاب المصلحة الداخليين والخارجيين، وأسلوب اتخاذ القرار."]],
q:[
{k:"tf",d:1,q:"A flat structure has many layers of middle managers.|الهيكل المسطح فيه طبقات كثيرة من المديرين الوسطاء.",a:1,e:"False. Flat = few or no middle managers.|غلط. المسطح = مديرون وسطاء قليلون أو معدومون."},
{k:"mc",d:2,q:"Which is NOT a managerial function in the lecture?|أي مما يلي ليس وظيفة إدارية في المحاضرة؟",o:["Staffing|التوظيف","Coordinating|التنسيق","Marketing|التسويق"],a:2,e:"The six are planning, organizing, staffing, directing, controlling, coordinating.|الست وظائف: تخطيط، تنظيم، توظيف، توجيه، رقابة، تنسيق."}]},
{t:"L3 · Information Systems|المحاضرة 3 · نظم المعلومات",c:[
["What is an IS?|ما هو IS؟","A set of components working together to collect, process, store and disseminate information to support decisions and control. Functional view: tech medium. Structural view: people + data + technology + processes. A CBIS uses computer technology.|مجموعة مكونات تعمل معًا لجمع المعلومات ومعالجتها وتخزينها ونشرها لدعم القرار والتحكم. المنظور الوظيفي: وسيط تقني. المنظور الهيكلي: أفراد + بيانات + تقنية + عمليات. و CBIS يستخدم الحاسوب."],
["Components|المكونات","People (users, IT specialists, managers), Processes, Data, Technology (hardware, software, networks, databases). Hardware: micro, mini, mainframe, supercomputers. Software: system, application, procedures.|الأفراد (مستخدمون، متخصصو IT، مديرون)، العمليات، البيانات، التقنية (عتاد، برمجيات، شبكات، قواعد بيانات). العتاد: ميكرو، ميني، ميينفريم، سوبر. البرمجيات: نظام، تطبيقات، إجراءات."],
["IS vs IT vs Computers|الفرق بين IS و IT والحاسب","Computer = tool for processing. IT = tech components (hardware, software, databases, networks). IS = IT + people + processes, so IT is a subsystem of IS. Analogy: a bus is the computer, the whole public transport system is the IS.|الحاسب = أداة معالجة. IT = المكونات التقنية. IS = IT + الأفراد + العمليات، أي أن IT نظام فرعي من IS. تشبيه: الأتوبيس هو الحاسب، ونظام المواصلات العام كله هو IS."],
["Types & examples|الأنواع والأمثلة","TPS (routine transactions), MIS (summaries and reports), DSS (complex decisions), ESS (executive dashboards). Examples: ERP (SAP, Oracle), CRM (Salesforce), EHR, LMS (Moodle).|TPS (المعاملات الروتينية)، MIS (ملخصات وتقارير)، DSS (القرارات المعقدة)، ESS (لوحات للتنفيذيين). أمثلة: ERP (SAP، Oracle)، CRM (Salesforce)، EHR، LMS (Moodle)."]],
q:[
{k:"mc",d:1,q:"IT is ___ of IS.|IT هو ___ من IS.",o:["a subsystem|نظام فرعي","the opposite|عكس","a replacement|بديل"],a:0,e:"IS = IT + people + processes.|IS = IT + الأفراد + العمليات."},
{k:"tf",d:1,q:"A CBIS never involves human participation.|نظام CBIS لا يشمل مشاركة بشرية أبدًا.",a:1,e:"False. CBIS usually includes people, hardware, software, data and networks.|غلط. CBIS يشمل عادة الأفراد والعتاد والبرمجيات والبيانات والشبكات."},
{k:"mc",d:2,q:"Which system gives executives high-level dashboards?|أي نظام يعطي التنفيذيين لوحات عرض عليا؟",o:["TPS","DSS","ESS"],a:2,e:"ESS = Executive Support Systems. TPS handles transactions; DSS handles complex decisions.|ESS = نظم دعم التنفيذيين. TPS للمعاملات و DSS للقرارات المعقدة."}]},
{t:"L5 · Personal Dimensions|المحاضرة 5 · الأبعاد الشخصية",c:[
["Time & Location|الزمن والمكان","Time: Timeliness (available when needed), Currency (reflects current state), Frequency (as often as needed), Time period (past, present, future). Location: information accessible anywhere (office, home, mobile).|الزمن: التوقيت (متاح عند الحاجة)، الآنية (يعكس الوضع الحالي)، التكرار (بقدر الحاجة)، الفترة الزمنية (ماضٍ وحاضر ومستقبل). المكان: الوصول للمعلومة من أي مكان (مكتب، بيت، موبايل)."],
["Content & Form|المحتوى والشكل","Content: accuracy, relevance, completeness, conciseness, scope. Form: clarity, detail, order, presentation, media.|المحتوى: الدقة، الملاءمة، الاكتمال، الإيجاز، النطاق. الشكل: الوضوح، التفصيل، الترتيب، العرض، الوسيط."],
["Information quality|جودة المعلومات","Reliability/consistency, integrity/validity (not tampered), uniqueness (no duplicates), usefulness, traceability/auditability (origin can be traced).|الاتساق والثبات، النزاهة والصلاحية (لم يتم العبث)، التفرد (بدون تكرار)، الفائدة، إمكانية التتبع والمراجعة (معرفة المصدر)."]],
q:[
{k:"tf",d:1,q:"The location dimension means information is accessible only from the workplace.|بُعد المكان يعني أن المعلومة متاحة من مكان العمل فقط.",a:1,e:"False. It should be accessible from anywhere.|غلط. لازم تكون متاحة من أي مكان."},
{k:"mc",d:1,q:"Timeliness refers to:|التوقيت (Timeliness) يشير إلى:",o:["Data accuracy|دقة البيانات","Information available when needed|توفر المعلومة عند الحاجة","Network speed|سرعة الشبكة"],a:1,e:"Too early = outdated, too late = useless.|مبكرة = قديمة، متأخرة = بلا فائدة."},
{k:"mc",d:2,q:"Which is NOT a personal dimension?|أي مما يلي ليس بُعدًا شخصيًا؟",o:["Time|الزمن","Form|الشكل","Organizational|التنظيمي"],a:2,e:"Personal: time, location, content, form. Organizational is a separate category.|الشخصية: زمن، مكان، محتوى، شكل. التنظيمي تصنيف مستقل."}]},
{t:"L5 · Organizational Dimensions|المحاضرة 5 · الأبعاد التنظيمية",c:[
["Pyramid & flows|الهرم والتدفقات","Pyramid: Strategic → Tactical → Operational → Non-management. Flows: Upward (current state, from transactions), Downward (strategies, goals, directives), Horizontal (between units), Inward/Outward (customers, suppliers, partners; basis of e-commerce).|الهرم: استراتيجي ← تكتيكي ← تشغيلي ← غير إداري. التدفقات: لأعلى (الوضع الحالي من المعاملات)، لأسفل (الاستراتيجيات والأهداف والتوجيهات)، أفقي (بين الوحدات)، داخل/خارج (عملاء وموردون وشركاء؛ أساس التجارة الإلكترونية)."],
["Granularity|درجة التفصيل","Fine = highly detailed (individual sales transactions), used at the bottom. Coarse = highly summarized (annual sales), used by strategic management. Information is consolidated from fine to coarse as it moves up.|الدقيقة = تفاصيل كثيرة (معاملات بيع فردية) في القاعدة. الخشنة = ملخصة جدًا (المبيعات السنوية) للإدارة الاستراتيجية. المعلومة تتلخص من دقيقة إلى خشنة وهي صاعدة."],
["What information describes|ماذا تصف المعلومة","Internal (inside the organization), External (environment), Objective (known, measurable), Subjective (unknown: estimates, forecasts, opinions). A competitor's rate is both external and objective.|داخلية (داخل المنظمة)، خارجية (البيئة)، موضوعية (حقائق معروفة وقابلة للقياس)، ذاتية (تقديرات وتوقعات وآراء). سعر منافس = خارجي وموضوعي معًا."]],
q:[
{k:"mc",d:2,q:"A sales transaction passed up to managers is which flow?|معاملة بيع تُرفع للمديرين تمثل أي تدفق؟",o:["Upward|لأعلى","Downward|لأسفل","Horizontal|أفقي"],a:0,e:"Upward flow describes the current state, starting from daily transactions.|التدفق لأعلى يصف الوضع الحالي ويبدأ من المعاملات اليومية."},
{k:"mc",d:3,q:"'What will the prime rate be next year?' is:|'ما سعر الفائدة الأساسي المتوقع العام القادم؟' معلومة:",o:["Objective|موضوعية","Subjective|ذاتية","Internal|داخلية"],a:1,e:"It describes something unknown (a forecast), so it is subjective.|تصف شيئًا غير معروف (توقع) فهي ذاتية."},
{k:"tf",d:2,q:"Strategic managers typically need fine granularity.|المديرون الاستراتيجيون يحتاجون عادة تفاصيل دقيقة جدًا (Fine).",a:1,e:"False. They use coarse, summarized information.|غلط. يستخدمون معلومات خشنة وملخصة."}]}
